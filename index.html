<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Карта Знаний</title>
<link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Cinzel:wght@400;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --parchment:#f4e4b8;
  --parchment-dark:#d4b483;
  --ink:#2c1a0e;
  --ink-light:#5c3a1e;
  --red:#8b1a1a;
  --gold:#c8860a;
  --gold-light:#f0c040;
  --sea:#4a7fa5;
  --sea-light:#7ab3cc;
  --forest:#3a6b3a;
}

body{
  background:#1a0f08;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  font-family:'Crimson Text',serif;
  overflow-x:hidden;
}

/* ── HEADER ── */
header{
  text-align:center;
  padding:28px 20px 10px;
  position:relative;
}
header h1{
  font-family:'Cinzel',serif;
  font-size:clamp(1.4rem,4vw,2.4rem);
  color:var(--gold-light);
  letter-spacing:.12em;
  text-shadow:0 0 30px #c8860a88,0 2px 4px #000;
}
header p{
  color:#c8a060;
  font-size:.95rem;
  font-style:italic;
  margin-top:4px;
  opacity:.85;
}

/* ── MAP CONTAINER ── */
.map-wrap{
  position:relative;
  width:min(900px,96vw);
  margin:16px auto 30px;
  border-radius:8px;
  overflow:hidden;
  box-shadow:0 0 0 4px #c8860a66, 0 0 0 8px #2c1a0e, 0 8px 48px #000c;
}

/* ── SVG MAP ── */
#map-svg{
  width:100%;
  height:auto;
  display:block;
  cursor:default;
}

/* ── MARKERS ── */
.loc-btn{
  cursor:pointer;
  transition:transform .2s;
  transform-origin:center;
  transform-box:fill-box;
}
.loc-btn:hover{transform:scale(1.25);}
.loc-btn circle.pulse{
  animation:pulse 2s infinite;
  transform-origin:center;
  transform-box:fill-box;
}
@keyframes pulse{
  0%,100%{r:11;opacity:.5;}
  50%{r:16;opacity:0;}
}
.loc-btn text{
  font-family:'Cinzel',serif;
  font-size:9px;
  fill:var(--ink);
  font-weight:700;
  pointer-events:none;
  text-anchor:middle;
}

/* ── MODAL ── */
#modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:200;
  background:#000000bb;
  backdrop-filter:blur(6px);
  align-items:center;
  justify-content:center;
}
#modal.open{display:flex;animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0}to{opacity:1}}

.modal-box{
  background:var(--parchment);
  border:3px solid var(--gold);
  border-radius:6px;
  width:min(660px,94vw);
  box-shadow:0 0 0 6px var(--ink),0 24px 64px #000e;
  overflow:hidden;
  animation:slidein .3s cubic-bezier(.34,1.56,.64,1);
  position:relative;
}
@keyframes slidein{from{transform:translateY(24px) scale(.97);opacity:0}to{transform:none;opacity:1}}

/* decorative corners */
.modal-box::before,.modal-box::after{
  content:'✦';
  position:absolute;
  font-size:1.1rem;
  color:var(--gold);
  top:8px;
}
.modal-box::before{left:12px;}
.modal-box::after{right:12px;}

.modal-head{
  background:var(--parchment-dark);
  padding:14px 48px 12px;
  border-bottom:2px solid var(--gold);
  text-align:center;
}
.modal-head h2{
  font-family:'Cinzel',serif;
  font-size:1.15rem;
  color:var(--ink);
  letter-spacing:.06em;
}
.modal-head p{
  font-size:.88rem;
  color:var(--ink-light);
  font-style:italic;
  margin-top:2px;
}

.close-btn{
  position:absolute;
  top:10px;right:10px;
  background:none;
  border:2px solid var(--ink-light);
  border-radius:4px;
  width:28px;height:28px;
  font-family:'Cinzel',serif;
  font-size:.75rem;
  color:var(--ink);
  cursor:pointer;
  z-index:10;
  transition:background .2s;
}
.close-btn:hover{background:var(--red);color:#fff;border-color:var(--red);}

.video-wrap{
  position:relative;
  padding-bottom:56.25%;
  background:#000;
}
.video-wrap iframe{
  position:absolute;inset:0;
  width:100%;height:100%;
  border:0;
}

/* ── LEGEND ── */
.legend{
  display:flex;flex-wrap:wrap;gap:8px 20px;
  justify-content:center;
  padding:0 20px 28px;
  max-width:900px;
  margin:0 auto;
}
.legend-item{
  display:flex;align-items:center;gap:6px;
  font-family:'Crimson Text',serif;
  font-size:.85rem;
  color:#c8a060;
  cursor:pointer;
  transition:color .2s;
}
.legend-item:hover{color:var(--gold-light);}
.legend-dot{
  width:12px;height:12px;
  border-radius:50%;
  background:var(--red);
  border:2px solid var(--gold);
  flex-shrink:0;
}
</style>
</head>
<body>

<header>
  <h1>📜 КАРТА ЗНАНИЙ</h1>
  <p>Исследуй земли мудрости — нажми на любую локацию</p>
</header>

<div class="map-wrap">
<!-- ══════════════════════════════════════════════
     SVG MAP  900×560
     Замени содержимое на свою картинку:
       <image href="map.jpg" width="900" height="560"/>
     ══════════════════════════════════════════════ -->
<svg id="map-svg" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <radialGradient id="sea-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#6aaac8"/>
      <stop offset="100%" stop-color="#2e5f80"/>
    </radialGradient>
    <filter id="shadow"><feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#0006"/></filter>
  </defs>

  <!-- SEA background -->
  <rect width="900" height="560" fill="url(#sea-grad)"/>

  <!-- Sea texture lines -->
  <g stroke="#4a7fa588" stroke-width=".8" fill="none">
    <path d="M0,80 Q100,70 200,80 Q300,90 400,80 Q500,70 600,80 Q700,90 800,80 Q850,75 900,80"/>
    <path d="M0,130 Q120,120 240,130 Q360,140 480,130 Q600,120 720,130 Q810,135 900,130"/>
    <path d="M0,200 Q90,190 180,200 Q350,215 500,200 Q650,185 800,200 Q860,205 900,200"/>
    <path d="M0,300 Q150,290 300,300 Q450,310 600,300 Q750,290 900,300"/>
    <path d="M0,400 Q100,390 250,400 Q420,412 570,400 Q720,388 900,400"/>
    <path d="M0,480 Q130,470 280,480 Q440,492 600,480 Q760,468 900,480"/>
  </g>

  <!-- CONTINENT 1 — main (center-left) -->
  <g filter="url(#shadow)">
    <path d="M120,80 Q200,50 320,60 Q430,45 500,80 Q560,100 580,150
             Q610,210 590,270 Q570,320 530,350 Q490,380 440,390
             Q390,400 340,380 Q280,360 240,320 Q190,280 160,230
             Q120,180 100,140 Q90,110 120,80Z"
          fill="#c8a85a" stroke="#8b6a20" stroke-width="2"/>
    <!-- hills -->
    <ellipse cx="280" cy="150" rx="30" ry="14" fill="#a07830" opacity=".6"/>
    <ellipse cx="320" cy="140" rx="22" ry="10" fill="#a07830" opacity=".6"/>
    <ellipse cx="420" cy="200" rx="28" ry="12" fill="#8b6a20" opacity=".5"/>
    <!-- forest patches -->
    <circle cx="200" cy="250" r="18" fill="#3a6b3a" opacity=".7"/>
    <circle cx="225" cy="240" r="14" fill="#4a8b4a" opacity=".7"/>
    <circle cx="190" cy="265" r="12" fill="#3a6b3a" opacity=".6"/>
    <circle cx="460" cy="290" r="16" fill="#3a6b3a" opacity=".7"/>
    <circle cx="480" cy="280" r="12" fill="#4a8b4a" opacity=".6"/>
    <!-- river -->
    <path d="M350,80 Q370,120 360,170 Q350,210 380,260 Q400,290 390,340"
          stroke="#6aaac8" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- roads -->
    <path d="M200,180 Q280,200 360,190 Q420,185 480,220"
          stroke="#8b6a20" stroke-width="1.5" fill="none" stroke-dasharray="6,4" opacity=".7"/>
    <path d="M300,270 Q340,300 380,320 Q420,340 440,360"
          stroke="#8b6a20" stroke-width="1.5" fill="none" stroke-dasharray="6,4" opacity=".7"/>
  </g>

  <!-- CONTINENT 2 — north-east island -->
  <g filter="url(#shadow)">
    <path d="M620,50 Q700,30 800,55 Q860,75 880,130
             Q890,180 860,210 Q830,240 780,245
             Q720,248 670,220 Q630,195 615,155
             Q600,115 620,50Z"
          fill="#c8a85a" stroke="#8b6a20" stroke-width="2"/>
    <ellipse cx="740" cy="120" rx="40" ry="18" fill="#8b6a20" opacity=".5"/>
    <circle cx="680" cy="160" r="15" fill="#3a6b3a" opacity=".7"/>
    <circle cx="700" cy="150" r="12" fill="#4a8b4a" opacity=".6"/>
    <circle cx="800" cy="140" r="13" fill="#3a6b3a" opacity=".7"/>
  </g>

  <!-- CONTINENT 3 — south island -->
  <g filter="url(#shadow)">
    <path d="M600,400 Q680,370 760,390 Q820,410 840,460
             Q850,500 810,525 Q760,545 700,535
             Q640,520 610,480 Q590,450 600,400Z"
          fill="#c8a85a" stroke="#8b6a20" stroke-width="2"/>
    <circle cx="700" cy="450" r="14" fill="#3a6b3a" opacity=".7"/>
    <circle cx="720" cy="440" r="10" fill="#4a8b4a" opacity=".6"/>
    <ellipse cx="760" cy="470" rx="20" ry="9" fill="#8b6a20" opacity=".5"/>
  </g>

  <!-- CONTINENT 4 — small west isle -->
  <g filter="url(#shadow)">
    <path d="M30,320 Q80,300 130,320 Q160,340 155,380
             Q148,415 110,425 Q70,430 40,405
             Q15,380 30,320Z"
          fill="#c8a85a" stroke="#8b6a20" stroke-width="2"/>
    <circle cx="90" cy="360" r="12" fill="#3a6b3a" opacity=".7"/>
  </g>

  <!-- Compass rose -->
  <g transform="translate(820,430)">
    <circle r="28" fill="#f4e4b8cc" stroke="#c8860a" stroke-width="2"/>
    <text y="-16" text-anchor="middle" font-family="Cinzel,serif" font-size="10" fill="#2c1a0e" font-weight="700">С</text>
    <text y="22"  text-anchor="middle" font-family="Cinzel,serif" font-size="10" fill="#2c1a0e" font-weight="700">Ю</text>
    <text x="-18" dy="4" text-anchor="middle" font-family="Cinzel,serif" font-size="10" fill="#2c1a0e" font-weight="700">З</text>
    <text x="18"  dy="4" text-anchor="middle" font-family="Cinzel,serif" font-size="10" fill="#2c1a0e" font-weight="700">В</text>
    <line x1="0" y1="-22" x2="0" y2="22" stroke="#c8860a" stroke-width="1.5"/>
    <line x1="-22" y1="0" x2="22" y2="0" stroke="#c8860a" stroke-width="1.5"/>
    <circle r="4" fill="#8b1a1a"/>
  </g>

  <!-- Paper texture overlay -->
  <rect width="900" height="560" fill="#f4e4b8" opacity=".12" filter="url(#paper)"/>
  <!-- Vignette -->
  <radialGradient id="vig" cx="50%" cy="50%" r="70%">
    <stop offset="60%" stop-color="transparent"/>
    <stop offset="100%" stop-color="#1a0f08aa"/>
  </radialGradient>
  <rect width="900" height="560" fill="url(#vig)"/>

  <!-- ══ LOCATION MARKERS ══
       cx,cy — позиция точки. Меняй под свою карту! -->

  <!-- 1. Деревня Начал -->
  <g class="loc-btn" data-id="0" onclick="openModal(0)">
    <circle class="pulse" cx="220" cy="210" r="11" fill="#8b1a1a" opacity=".3"/>
    <circle cx="220" cy="210" r="10" fill="#8b1a1a" stroke="#f0c040" stroke-width="2"/>
    <text x="220" y="213" fill="#f4e4b8" font-size="9" font-family="Cinzel,serif" font-weight="700" text-anchor="middle">1</text>
    <text x="220" y="230" fill="#2c1a0e" font-size="8" font-family="Cinzel,serif" font-weight="700" text-anchor="middle">Деревня</text>
    <text x="220" y="239" fill="#2c1a0e" font-size="8" font-family="Cinzel,serif" font-weight="700" text-anchor="middle">Начал</text>
  </g>

  <!-- 2. Академия Основ -->
  <g class="loc-btn" data-id="1" onclick="openModal(1)">
    <circle class="pulse" cx="360" cy="170" r="11" fill="#8b1a1a" opacity=".3"/>
    <circle cx="360" cy="170" r="10" fill="#8b1a1a" stroke="#f0c040" stroke-width="2"/>
    <text x="360" y="173" fill="#f4e4b8" font-size="9" font-family="Cinzel,serif" font-weight="700" text-anchor="middle">2</text>
    <text x="360" y="190" fill="#2c1a0e" font-size="8" font-family="Cinzel,serif" font-weight="700" text-anchor="middle">Академия</text>
    <text x="360" y="199" fill="#2c1a0e" font-size="8" font-family="Cinzel,serif" font-weight="700" text-anchor="middle">Основ</text>
  </g>

  <!-- 3. Лес Практики -->
  <g class="loc-btn" data-id="2" onclick="openModal(2)">
    <circle class="pulse" cx="210" cy="265" r="11" fill="#8b1a1a" opacity=".3"/>
    <circle cx="210" cy="265" r="10" fill="#8b1a1a" stroke="#f0c040" stroke-width="2"/>
    <text x="210" y="268" fill="#f4e4b8" font-size="9" font-family="Cinzel,serif" font-weight="700" text-anchor="middle">3</text>
    <text x="210" y="285" fill="#2c1a0e" font-size="8" font-family="Cinzel,serif" font-weight="700" text-anchor="middle">Лес</text>
    <text x="210" y="294" fill="#2c1a0e" font-size="8" font-family="Cinzel,serif" font-weight="700" text-anchor="middle">Практики</text>
  </g>

  <!-- 4. Цитадель Теории -->
  <g class="loc-btn" data-id="3" onclick="openModal(3)">
    <circle class="pulse" cx="460" cy="230" r="11" fill="#8b1a1a" opacity=".3"/>
    <circle cx="460" cy="230" r="10" fill="#8b1a1a" stroke="#f0c040" stroke-width="2"/>
    <text x="460" y="233" fill="#f4e4b8" font-size="9" font-family="Cinzel,serif" font-weight="700" text-anchor="middle">4</text>
    <text x="460" y="250" fill="#2c1a0e" font-size="8" font-family="Cinzel,serif" font-weight="700" text-anchor="middle">Цитадель</text>
    <text x="460" y="259" fill="#2c1a0e" font-size="8" font-family="Cinzel,serif" font-weight="700" text-anchor="middle">Теории</text>
  </g>

  <!-- 5. Остров Испытаний -->
  <g class="loc-btn" data-id="4" onclick="openModal(4)">
    <circle class="pulse" cx="740" cy="130" r="11" fill="#8b1a1a" opacity=".3"/>
    <circle cx="740" cy="130" r="10" fill="#8b1a1a" stroke="#f0c040" stroke-width="2"/>
    <text x="740" y="133" fill="#f4e4b8" font-size="9" font-family="Cinzel,serif" font-weight="700" text-anchor="middle">5</text>
    <text x="740" y="150" fill="#2c1a0e" font-size="8" font-family="Cinzel,serif" font-weight="700" text-anchor="middle">Остров</text>
    <text x="740" y="159" fill="#2c1a0e" font-size="8" font-family="Cinzel,serif" font-weight="700" text-anchor="middle">Испытаний</text>
  </g>

  <!-- 6. Руины Прошлых Знаний -->
  <g class="loc-btn" data-id="5" onclick="openModal(5)">
    <circle class="pulse" cx="90" cy="370" r="11" fill="#8b1a1a" opacity=".3"/>
    <circle cx="90" cy="370" r="10" fill="#8b1a1a" stroke="#f0c040" stroke-width="2"/>
    <text x="90" y="373" fill="#f4e4b8" font-size="9" font-family="Cinzel,serif" font-weight="700" text-anchor="middle">6</text>
    <text x="90" y="390" fill="#2c1a0e" font-size="8" font-family="Cinzel,serif" font-weight="700" text-anchor="middle">Руины</text>
    <text x="90" y="399" fill="#2c1a0e" font-size="8" font-family="Cinzel,serif" font-weight="700" text-anchor="middle">Прошлого</text>
  </g>

  <!-- 7. Башня Мастера -->
  <g class="loc-btn" data-id="6" onclick="openModal(6)">
    <circle class="pulse" cx="710" cy="460" r="11" fill="#8b1a1a" opacity=".3"/>
    <circle cx="710" cy="460" r="10" fill="#8b1a1a" stroke="#f0c040" stroke-width="2"/>
    <text x="710" y="463" fill="#f4e4b8" font-size="9" font-family="Cinzel,serif" font-weight="700" text-anchor="middle">7</text>
    <text x="710" y="480" fill="#2c1a0e" font-size="8" font-family="Cinzel,serif" font-weight="700" text-anchor="middle">Башня</text>
    <text x="710" y="489" fill="#2c1a0e" font-size="8" font-family="Cinzel,serif" font-weight="700" text-anchor="middle">Мастера</text>
  </g>

</svg>
</div><!-- .map-wrap -->

<!-- LEGEND -->
<div class="legend" id="legend"></div>

<!-- MODAL -->
<div id="modal">
  <div class="modal-box">
    <button class="close-btn" onclick="closeModal()" title="Закрыть">✕</button>
    <div class="modal-head">
      <h2 id="m-title"></h2>
      <p id="m-desc"></p>
    </div>
    <div class="video-wrap">
      <iframe id="yt" allow="autoplay;fullscreen" allowfullscreen></iframe>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  ДАННЫЕ — замени youtubeId и описания под свой курс!
// ═══════════════════════════════════════════════════════
const locations = [
  { title:"Деревня Начал",          desc:"Введение в курс · Урок 1",          youtubeId:"dQw4w9WgXcQ" },
  { title:"Академия Основ",         desc:"Базовые концепции · Урок 2",         youtubeId:"dQw4w9WgXcQ" },
  { title:"Лес Практики",           desc:"Первые задания · Урок 3",            youtubeId:"dQw4w9WgXcQ" },
  { title:"Цитадель Теории",        desc:"Углублённая теория · Урок 4",        youtubeId:"dQw4w9WgXcQ" },
  { title:"Остров Испытаний",       desc:"Тесты и проверки · Урок 5",          youtubeId:"dQw4w9WgXcQ" },
  { title:"Руины Прошлого",         desc:"История и контекст · Урок 6",        youtubeId:"dQw4w9WgXcQ" },
  { title:"Башня Мастера",          desc:"Финальный проект · Урок 7",          youtubeId:"dQw4w9WgXcQ" },
];
// ═══════════════════════════════════════════════════════

// Build legend
const leg = document.getElementById('legend');
locations.forEach((l,i)=>{
  const d = document.createElement('div');
  d.className='legend-item';
  d.innerHTML=`<div class="legend-dot"></div>${i+1}. ${l.title}`;
  d.onclick=()=>openModal(i);
  leg.appendChild(d);
});

function openModal(i){
  const l = locations[i];
  document.getElementById('m-title').textContent = l.title;
  document.getElementById('m-desc').textContent  = l.desc;
  document.getElementById('yt').src = `https://www.youtube.com/embed/${l.youtubeId}?autoplay=1&rel=0`;
  const m = document.getElementById('modal');
  m.classList.add('open');
}
function closeModal(){
  document.getElementById('modal').classList.remove('open');
  document.getElementById('yt').src='';
}
document.getElementById('modal').addEventListener('click', e=>{
  if(e.target===document.getElementById('modal')) closeModal();
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });
</script>
</body>
</html>
