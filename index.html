<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>РГУ им. Есенина — Карта корпусов</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://api-maps.yandex.ru/2.1/?apikey=7b36fbc9-b390-4016-be81-5a1b45637a63&lang=ru_RU" type="text/javascript"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d0f14;
  --card: #1c2030;
  --accent: #e8b84b;
  --accent2: #4b8ee8;
  --text: #f0eeea;
  --muted: #6b7280;
  --border: rgba(232,184,75,0.15);
}
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Raleway', sans-serif; overflow: hidden; }

header {
  height: 56px; padding: 0 1rem;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  background: var(--bg); z-index: 10; position: relative;
}
header h1 { font-family: 'Unbounded', sans-serif; font-size: 0.9rem; font-weight: 900; color: var(--accent); white-space: nowrap; }
header span { font-size: 0.65rem; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; text-align: right; }

.layout { 
  display: flex; 
  flex-direction: column;
  height: calc(100vh - 56px); 
  position: relative; 
}

#map { 
  flex: 1; 
  width: 100%; 
  position: relative; 
}

/* Мини-карта (инсет) */
.inset-map {
  position: absolute;
  bottom: 20px;
  left: 12px;
  width: 220px;
  height: 140px;
  background: var(--card);
  border: 2px solid var(--accent);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  z-index: 100;
  transition: all 0.3s ease;
  cursor: pointer;
}
.inset-map:hover { border-color: var(--accent2); }
.inset-map .inset-label {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: rgba(13,15,20,0.9);
  backdrop-filter: blur(4px);
  padding: 6px 8px;
  font-size: 0.65rem;
  font-weight: 500;
  color: var(--accent);
  z-index: 10;
  font-family: 'Unbounded', sans-serif;
}
.inset-map .inset-label small {
  font-size: 0.55rem;
  color: var(--text);
  opacity: 0.7;
  display: block;
  font-family: 'Raleway', sans-serif;
  margin-top: 2px;
}
.inset-map .close-inset {
  position: absolute;
  top: 6px; right: 6px;
  background: rgba(0,0,0,0.7);
  border-radius: 50%;
  width: 22px; height: 22px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 20; font-size: 10px; color: #fff;
}
#inset-mini-map { width: 100%; height: 100%; }

/* Модальное окно — строго фиксированная лаконичная карточка */
.modal {
  display: none;
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(6px);
  z-index: 1000;
  justify-content: center;
  align-items: center;
  padding: 16px;
}
.modal.visible { display: flex; }
.modal-content {
  width: 100%; max-width: 400px;
  background: var(--card); border-radius: 16px; border: 1px solid var(--accent);
  box-shadow: 0 20px 40px rgba(0,0,0,0.6); position: relative;
}
.modal-info { padding: 24px; }
.modal-name { font-family: 'Unbounded', sans-serif; font-size: 16px; font-weight: 700; margin-bottom: 8px; line-height: 1.4; color: var(--text); }
.modal-addr { font-size: 13px; color: var(--muted); margin-bottom: 20px; font-weight: 400; }

.modal-link {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 13px; font-weight: 600; color: #0d0f14; background: var(--accent);
  text-decoration: none; padding: 12px 14px; border-radius: 8px;
  transition: background 0.2s;
}
.modal-link:hover { background: #f3c967; }
.modal-close {
  position: absolute; top: 12px; right: 12px;
  background: rgba(255,255,255,0.05); border-radius: 50%; width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 14px; color: var(--muted); z-index: 1020;
  transition: color 0.2s;
}
.modal-close:hover { color: #fff; }

/* Навигационная лента кнопок */
.chips {
  position: relative;
  display: flex; 
  flex-wrap: nowrap; 
  gap: 8px; 
  padding: 12px; 
  z-index: 200;
  background: var(--bg);
  border-top: 1px solid var(--border);
  overflow-x: auto; 
  -webkit-overflow-scrolling: touch;
}
.chips::-webkit-scrollbar { display: none; }
.chips { -ms-overflow-style: none; scrollbar-width: none; }
.chip {
  flex: 0 0 auto; font-size: 11px; padding: 8px 14px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 20px; cursor: pointer; color: var(--text); font-weight: 500;
}
.chip.active { border-color: var(--accent); color: #000; background: var(--accent); font-weight: 600; }

@media (max-width: 600px) {
  header { height: 48px; }
  .layout { height: calc(100vh - 48px); }
  .inset-map { width: 150px; height: 110px; bottom: 15px; left: 8px; }
  .chip { padding: 6px 12px; font-size: 10px; }
}
</style>
</head>
<body>

<header>
  <h1>РГУ им. С.А. Есенина</h1>
  <span>Карта корпусов<br>Рязань</span>
</header>

<div class="layout">
  <div id="map">
    <div class="inset-map" id="inset-container">
      <div class="inset-label">📊 Факультет экономики<small>Первомайский пр-т, 49/2</small></div>
      <div class="close-inset" id="close-inset">✕</div>
      <div id="inset-mini-map"></div>
    </div>
  </div>
  <div class="chips" id="chips"></div>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <div class="modal-close" id="modal-close">✕</div>
    <div class="modal-info">
      <div class="modal-name" id="modal-name"></div>
      <div class="modal-addr" id="modal-addr"></div>
      <a class="modal-link" id="modal-link" href="#" target="_blank">🗺 Открыть на Яндекс Картах</a>
    </div>
  </div>
</div>

<script>
const buildings = [
  { id:0, label:"ИЕН | ИИЯ | ИИФНП | ИФМиКН", address:"ул. Свободы, 46", name:"ИЕН | ИИЯ | ИИФНП | ИФМиКН", fullAddress:"📍 ул. Свободы, 46, Рязань", maplink:"https://yandex.ru/maps/207/ryazan/house/ulitsa_svobody_46/", lat:54.628879, lng:39.752508, icon:"⭐" },
  { id:1, label:"Корпус 46к1", address:"ул. Свободы, 46к1", name:"Учебный корпус (46к1)", fullAddress:"📍 ул. Свободы, 46к1, Рязань", maplink:"https://yandex.ru/maps/207/ryazan/house/ulitsa_svobody_46k1/", lat:54.630010, lng:39.752682, icon:"🏫" },
  { id:2, label:"Корпус 46к2", address:"ул. Свободы, 46к2", name:"Учебный корпус (46к2)", fullAddress:"📍 ул. Свободы, 46к2, Рязань", maplink:"https://yandex.ru/maps/207/ryazan/house/ulitsa_svobody_46k2/", lat:54.629782, lng:39.752190, icon:"🏫" },
  { id:3, label:"Ленина, 20", address:"ул. Ленина, 20", name:"Корпус на Ленина", fullAddress:"📍 ул. Ленина, 20, Рязань", maplink:"https://yandex.ru/maps/207/ryazan/house/ulitsa_lenina_20/", lat:54.624633, lng:39.752238, icon:"🏰" },
  { id:4, label:"ФРФНК", address:"ул. Ленина, 20А", name:"ФРФНК", fullAddress:"📍 ул. Ленина, 20А, Рязань", maplink:"https://yandex.ru/maps/207/ryazan/house/ulitsa_lenina_20a/", lat:54.624953, lng:39.752631, icon:"🏢" },
  { id:5, label:"ФФКС | ИППСР", address:"ул. Полонского, 18", name:"ФФКС | ИППСР", fullAddress:"📍 ул. Полонского, 18, Рязань", maplink:"https://yandex.ru/maps/207/ryazan/house/ulitsa_polonskogo_18/", lat:54.629275, lng:39.747663, icon:"🧠" },
  { id:6, label:"Факультет экономики", address:"Первомайский пр-т, 49/2", name:"Факультет экономики", fullAddress:"📍 Первомайский проспект, 49/2, Рязань", maplink:"https://yandex.ru/maps/207/ryazan/house/pervomayskiy_prospekt_49k2/", lat:54.628388, lng:39.710390, icon:"📊" },
  { id:7, label:"ЮИ", address:"ул. Семинарская, 15", name:"Юридический институт (ЮИ)", fullAddress:"📍 ул. Семинарская, 15, Рязань", maplink:"https://yandex.ru/maps/207/ryazan/house/seminarskaya_ulitsa_15/", lat:54.632567, lng:39.736563, icon:"⚖️" }
];

let activeId = null;
let currentMap = null;
const allPlacemarks = {};

const defaultBounds = [[54.6335, 39.7340], [54.6225, 39.7575]];

ymaps.ready(function () {
  const myMap = new ymaps.Map('map', {
    center: [54.6270, 39.7507],
    zoom: 15,
    controls: ['zoomControl']
  }, {
    maxZoom: 19,
    minZoom: 13
  });
  myMap.options.set('suppressMapOpenBlock', true);
  myMap.setBounds(defaultBounds, { checkZoomRange: true, zoomMargin: 20 });
  currentMap = myMap;

  const clusterer = new ymaps.Clusterer({
    preset: 'islands#goldClusterIcons',
    groupByCoordinates: false,
    clusterDisableClickZoom: false,
    gridSize: 128,
    margin: 45,
    useMapMargin: true
  });

  const MyLayout = ymaps.templateLayoutFactory.createClass(`
    <style>
      .pin-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        cursor: pointer;
        filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
        transition: transform 0.2s ease;
      }
      .pin-wrap:hover { transform: translateY(-4px); }
      .pin-photo {
        width: 56px; height: 56px;
        border-radius: 50%; border: 3px solid #ffffff;
        background: #1c2030; display: flex;
        align-items: center; justify-content: center;
        font-size: 1.8rem; background: rgba(28,32,48,0.95);
        box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      }
      .pin-line { width: 2px; height: 8px; background: #ffffff; }
      .pin-label {
        background: #102a47; color: #ffffff;
        font-family: 'Raleway', sans-serif; font-weight: 600; font-size: 9px;
        padding: 4px 8px; border-radius: 16px; text-align: center; white-space: nowrap;
      }
      .pin-line2 { width: 2px; height: 10px; background: #ffffff; }
      .pin-dot {
        width: 10px; height: 10px; border-radius: 50%;
        background: #e63946; border: 2px solid #ffffff;
      }
      .pin-wrap.active .pin-photo { border-color: #e8b84b; transform: scale(1.02); }
      .pin-wrap.active .pin-label { background: #e8b84b; color: #0d0f14; font-weight:700; }
      .pin-wrap.active .pin-line, .pin-wrap.active .pin-line2 { background: #e8b84b; }
      .pin-wrap.active .pin-dot { background: #e8b84b; box-shadow: 0 0 0 2px rgba(232,184,75,0.5); }
    </style>
    <div class="pin-wrap" id="pin-$[properties.id]">
      <div class="pin-photo">$[properties.photoHtml]</div>
      <div class="pin-line"></div>
      <div class="pin-label">$[properties.label]</div>
      <div class="pin-line2"></div>
      <div class="pin-dot"></div>
    </div>
  `);

  const geoObjects = [];

  buildings.forEach(b => {
    const iconHtml = (b.id === 0) ? '<span style="color:#e8b84b;">⭐</span>' : b.icon;
    const photoHtml = `<div style="font-size:26px; line-height:1;">${iconHtml}</div>`;
    
    const placemark = new ymaps.Placemark([b.lat, b.lng], {
      id: b.id,
      label: b.label,
      photoHtml: photoHtml
    }, {
      iconLayout: MyLayout,
      iconShape: { type: 'Rectangle', coordinates: [[-28, -82], [28, 24]] },
      hasBalloon: false,
      zIndexHover: 1000
    });

    placemark.events.add('click', (e) => {
      e.preventDefault();
      openModal(b.id, myMap);
    });

    allPlacemarks[b.id] = placemark;
    geoObjects.push(placemark);
  });

  clusterer.add(geoObjects);
  myMap.geoObjects.add(clusterer);
  
  // Инсет-карта (Эконом)
  const insetMap = new ymaps.Map('inset-mini-map', {
    center: [54.628388, 39.710390], zoom: 15, controls: []
  });
  insetMap.options.set('suppressMapOpenBlock', true);
  insetMap.geoObjects.add(new ymaps.Placemark([54.628388, 39.710390], {}, { preset: 'islands#goldCircleIcon' }));
  
  document.getElementById('inset-container').onclick = (e) => {
    if (e.target.classList?.contains('close-inset')) return;
    openModal(6, myMap);
  };
  document.getElementById('close-inset').onclick = (e) => {
    e.stopPropagation();
    document.getElementById('inset-container').style.display = 'none';
  };
  
  // Генерация чипсов
  const chipsEl = document.getElementById('chips');
  buildings.forEach(b => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.dataset.id = b.id;
    chip.textContent = b.label;
    chip.onclick = () => openModal(b.id, myMap);
    chipsEl.appendChild(chip);
  });
});

function openModal(id, map) {
  if (activeId !== null) {
    const prevPin = document.getElementById('pin-' + activeId);
    if (prevPin) prevPin.classList.remove('active');
  }
  activeId = id;
  const building = buildings.find(b => b.id === id);
  if (!building) return;
  
  const currentPin = document.getElementById('pin-' + id);
  if (currentPin) currentPin.classList.add('active');
  
  document.querySelectorAll('.chip').forEach(ch => ch.classList.remove('active'));
  const activeChip = document.querySelector(`.chip[data-id="${id}"]`);
  if (activeChip) {
    activeChip.classList.add('active');
    activeChip.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  }
  
  if (map) {
    const targetZoom = map.getZoom() < 16 ? 17 : map.getZoom();
    const offsetLat = window.innerWidth < 600 ? building.lat - 0.0008 : building.lat;
    map.setZoom(targetZoom, { duration: 300 }).then(() => {
      map.panTo([offsetLat, building.lng], { flying: true, duration: 300 });
    });
  }
  
  // Заполнение только названия, адреса и ссылки
  document.getElementById('modal-name').textContent = building.name;
  document.getElementById('modal-addr').textContent = building.fullAddress;
  document.getElementById('modal-link').href = building.maplink;
  
  document.getElementById('modal').classList.add('visible');
}

document.getElementById('modal-close').onclick = () => {
  document.getElementById('modal').classList.remove('visible');
};
document.getElementById('modal').onclick = (e) => {
  if (e.target === document.getElementById('modal')) {
    document.getElementById('modal').classList.remove('visible');
  }
};
</script>
</body>
</html>
